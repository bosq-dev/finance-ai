[project]
name = "valuation-multiagente"
version = "0.1.0"
description = "App de chat multi-agente para teste de avaliação de ações"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.100.0",
    "crewai>=1.14.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
]

[project.scripts]
valuation-app = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
